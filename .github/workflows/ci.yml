name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装 ruff
        run: pip install ruff

      # 只查真错误（语法错误 / 未定义名称），不查代码风格。
      # 完整的 ruff 检查目前有 22 条 import 排序提示，另行清理。
      - name: 检查语法错误与未定义名称
        run: ruff check --select E9,F63,F7,F82 framework uds uds_tests

  uds-tests:
    name: UDS 用例 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 只跑 uds_tests：tests/ 需要 CANoe 和许可证，CI 机器上没有。
      - name: 运行 UDS 诊断用例
        run: |
          mkdir -p reports
          python -m pytest uds_tests -v --html=reports/uds_report.html --self-contained-html

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uds-report-py${{ matrix.python-version }}
          path: reports/uds_report.html
